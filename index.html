<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F5F6FA;--card:#fff;--ink:#12141C;--mut:#6B7280;--line:#E7E9F0;--ac:#6D4AFF;--ac2:#3B82F6;--red:#EF4444;--grn:#16A34A}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 15% 10%,#E6E0FF 0,transparent 60%),radial-gradient(800px 500px at 90% 90%,#DCEBFF 0,transparent 60%),#EEF0F7;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:64px;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.side{max-width:260px}
.side .lg{display:flex;align-items:center;gap:12px;font-weight:800;font-size:28px;letter-spacing:-.5px}
.side p{margin-top:12px;color:var(--mut);font-size:15px;line-height:1.5}
.side .tl{margin-top:22px;padding:11px 18px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 20px rgba(18,20,28,.25)}
.credit{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:#8a90a2}
.credit a{color:#5b46d6;text-decoration:none;font-weight:600}
/* phone */
.phone{position:relative;height:min(860px,calc(100vh - 92px));width:calc(min(860px,100vh - 92px)*390/844);border-radius:52px;background:#0b0c10;padding:11px;box-shadow:0 0 0 2px #2b2e38,0 40px 90px rgba(40,30,110,.35),inset 0 0 0 2px #1b1d25}
.scr{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:98px;height:28px;border-radius:20px;background:#000;z-index:60}
.sbar{height:46px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-size:13px;font-weight:700;background:var(--bg);z-index:5}
.sbar.dk{background:#000;color:#fff}
.body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.page{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:12px;animation:fade .3s ease}
.page::-webkit-scrollbar{display:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:520px){body{display:block;background:var(--bg)}.side,.credit.d{display:none}.phone{height:100dvh;width:100vw;border-radius:0;padding:0;box-shadow:none;background:none}.scr{border-radius:0}.isl,.sbar{display:none}.body{padding-top:env(safe-area-inset-top)}}
/* header */
.hd{display:flex;align-items:center;gap:8px;padding:6px 16px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.4px;flex:1}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 3px rgba(20,20,40,.08);position:relative}
.ib svg{width:19px;height:19px}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.tk{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 8px;border-radius:19px;background:linear-gradient(135deg,#FFF4D6,#FFE8A8);font-weight:700;font-size:14px;color:#6b4a00;box-shadow:0 1px 3px rgba(150,100,0,.2)}
.tk svg{width:22px;height:22px}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#ddd}
.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.25)}}
/* nav */
.nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:6}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#8b90a0}
.nav svg{width:22px;height:22px}
.nav .on{color:var(--ac)}
/* home */
.hero{margin:4px 16px 14px;border-radius:24px;overflow:hidden;position:relative;aspect-ratio:16/11;background:linear-gradient(135deg,#6D4AFF,#3B82F6);cursor:pointer;box-shadow:0 12px 28px rgba(60,50,150,.28)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 25%,rgba(0,0,0,.85))}
.hero .in{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:#fff}
.hero h2{font-size:21px;line-height:1.2;letter-spacing:-.3px;margin:8px 0 6px}
.hrow{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.95}
.hrow img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,#7C5CFF,#5B3CF0);color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 18px rgba(109,74,255,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.cta svg{width:16px;height:16px}
.live{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.5px}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.3}}
.vw{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600}
.vw svg{width:12px;height:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:20px;background:var(--card);font-size:13px;font-weight:600;color:#4b5160;box-shadow:0 1px 2px rgba(20,20,40,.06)}
.chip.on{background:var(--ink);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 10px;font-weight:800;font-size:17px}
.feed{display:grid;grid-template-columns:1fr;gap:14px;padding:0 16px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 2px 10px rgba(20,20,50,.06);cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(20,20,50,.12)}
.th{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#d9d4ff,#cfe3ff);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th .live{position:absolute;top:10px;left:10px}
.th .vw{position:absolute;top:10px;right:10px}
.cb{padding:12px 14px 14px}
.cb h3{font-size:15px;line-height:1.3;letter-spacing:-.2px}
.cm{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:var(--mut)}
.cm img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.cm b{color:var(--ink);font-weight:600}
.cat{margin-left:auto;padding:3px 9px;border-radius:8px;background:#F0ECFF;color:#5b3cf0;font-weight:600;font-size:11px}
.wb{margin-top:12px;width:100%;padding:11px;border-radius:12px;background:#F0ECFF;color:#5b3cf0;font-weight:700;font-size:13px}
.sk{border-radius:20px;height:250px;background:linear-gradient(90deg,#eceef5 25%,#f7f8fc 50%,#eceef5 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.srch{margin:0 16px 14px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 14px;height:46px;box-shadow:0 1px 3px rgba(20,20,40,.08)}
.srch input{flex:1;border:0;outline:0;background:none;font-size:15px}
.srch svg{width:18px;height:18px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 24px;font-size:14px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.ct{border-radius:18px;padding:16px;color:#fff;font-weight:700;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
.ct small{font-weight:500;opacity:.85;margin-top:2px}
/* login */
.lg-wrap{flex:1;display:flex;flex-direction:column;padding:0 24px 20px;background:var(--bg);overflow-y:auto;scrollbar-width:none}
.lg-hero{position:relative;margin:0 -24px;height:250px;flex:none;border-radius:0 0 34px 34px;overflow:hidden;background:#3b2a7a}.lg-hero img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}.lg-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,60,.25),transparent 40%,rgba(20,10,60,.55))}.lg-hero .lg-logo{position:absolute;left:22px;bottom:18px;z-index:2;width:52px;height:52px;border-radius:16px}.lg-hero .live{position:absolute;right:20px;top:18px;z-index:2}
.lg-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#7C5CFF,#3B82F6);display:grid;place-items:center;box-shadow:0 14px 28px rgba(109,74,255,.4)}
.lg-wrap h1{font-size:27px;line-height:1.15;letter-spacing:-.8px;margin:20px 0 8px}
.lg-wrap p{color:var(--mut);font-size:15px;line-height:1.5}
.phf{display:flex;gap:8px;margin-top:18px}
.phf select,.phf input,.otp{height:54px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-size:16px;outline:0}
.phf select{width:84px}.phf input{flex:1;min-width:0}
.phf input:focus,.otp:focus{border-color:var(--ac)}
.otp{width:100%;margin-top:26px;text-align:center;letter-spacing:12px;font-size:24px;font-weight:700}
.big{margin-top:16px;width:100%;height:54px;border-radius:16px;background:linear-gradient(135deg,#7C5CFF,#5B3CF0);color:#fff;font-weight:700;font-size:16px;box-shadow:0 10px 22px rgba(109,74,255,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.big:disabled{opacity:.5}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
.hint{margin-top:14px;font-size:13px;color:var(--mut);text-align:center}
.lnk{color:var(--ac);font-weight:600}
/* wallet */
.wc{margin:4px 16px 16px;border-radius:24px;padding:20px;color:#fff;background:radial-gradient(300px 160px at 90% 0,rgba(255,255,255,.25),transparent),linear-gradient(135deg,#5B3CF0,#3B82F6);box-shadow:0 14px 30px rgba(70,60,200,.35)}
.wc .lb{opacity:.85;font-size:13px}
.wc .nm{display:flex;align-items:center;gap:10px;font-size:40px;font-weight:800;letter-spacing:-1px;margin:6px 0 14px}
.wc .nm svg{width:38px;height:38px}
.wadd{padding:11px 18px;border-radius:13px;background:#fff;color:#4a2fd0;font-weight:700;font-size:14px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.st div{background:#fff;border-radius:16px;padding:14px;font-size:12px;color:var(--mut);box-shadow:0 1px 4px rgba(20,20,50,.06)}
.st b{display:block;font-size:22px;color:var(--ink);margin-top:4px}
.tx{display:flex;align-items:center;gap:12px;margin:0 16px 10px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 1px 4px rgba(20,20,50,.05)}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ti.c{background:#DCFCE7;color:var(--grn)}.ti.d{background:#FEE2E2;color:var(--red)}
.ti svg{width:18px;height:18px}
.tx .m{flex:1;min-width:0}.tx .m b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m small{color:var(--mut);font-size:11.5px}
.tx .a{text-align:right;font-weight:800;font-size:14px}.tx .a small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.pos{color:var(--grn)}.neg{color:var(--red)}
/* store */
.packs{display:flex;flex-direction:column;gap:12px;padding:0 16px 8px}
.pk{position:relative;display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:16px;border:2px solid transparent;box-shadow:0 2px 10px rgba(20,20,50,.06)}
.pk.hot{border-color:var(--ac);background:linear-gradient(135deg,#F7F4FF,#fff);box-shadow:0 12px 26px rgba(109,74,255,.2)}
.pk .badge{position:absolute;top:-10px;right:16px;background:var(--ac);color:#fff;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:10px;letter-spacing:.4px}
.pk .ci svg{width:54px;height:54px}
.pk .i{flex:1}.pk .i b{font-size:20px;letter-spacing:-.4px}.pk .i small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.pk .bn{padding:11px 16px;border-radius:13px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.pk.hot .bn{background:linear-gradient(135deg,#7C5CFF,#5B3CF0);box-shadow:0 8px 16px rgba(109,74,255,.4)}
.ph{padding:6px 20px 16px}.ph h1{font-size:26px;letter-spacing:-.6px}.ph p{color:var(--mut);margin-top:6px;font-size:14.5px;line-height:1.45}
/* profile */
.pr{display:flex;flex-direction:column;align-items:center;padding:8px 16px 18px}
.pr img{width:92px;height:92px;border-radius:50%;object-fit:cover;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.pr h2{margin-top:12px;font-size:21px}.pr small{color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;margin:0 16px 10px;background:#fff;border-radius:16px;padding:15px 16px;font-size:14.5px;font-weight:600;width:calc(100% - 32px);text-align:left}
.row span{margin-left:auto;color:var(--mut);font-weight:500;font-size:13px}
.row.out{color:var(--red)}
/* overlays */
#ov{position:absolute;inset:0;z-index:50;pointer-events:none}
.bd{position:absolute;inset:0;background:rgba(10,12,20,.55);opacity:0;transition:.25s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:10px 0 20px;max-height:86%;overflow-y:auto;transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1);pointer-events:auto;scrollbar-width:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#d8dbe5;margin:0 auto 12px}
.show .bd{opacity:1}.show .sheet{transform:none}
.mod{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%) scale(.92);background:#fff;border-radius:26px;padding:22px;opacity:0;transition:.25s;pointer-events:auto;text-align:center}
.show .mod{opacity:1;transform:translateY(-50%)}
.mod h3{font-size:19px;margin:10px 0 4px}.mod .sum{background:var(--bg);border-radius:16px;padding:14px;margin:14px 0;text-align:left;font-size:14px}
.mod .sum div{display:flex;justify-content:space-between;padding:4px 0}
.ghost{width:100%;padding:12px;font-weight:600;color:var(--mut);margin-top:4px}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes rot{to{transform:rotate(360deg)}}
.okc{width:68px;height:68px;border-radius:50%;background:#DCFCE7;color:var(--grn);display:grid;place-items:center;margin:0 auto;animation:pop .6s ease}
.okc svg{width:34px;height:34px}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-30px);background:#12141C;color:#fff;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;z-index:70;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center;max-width:92%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ni{display:flex;gap:12px;padding:12px 20px;font-size:14px}.ni small{color:var(--mut);display:block;margin-top:2px}
.tg{margin-left:auto;width:44px;height:26px;border-radius:13px;background:#d5d8e2;position:relative;transition:.2s;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--ac)}.tg.on:after{left:21px}
.tl2{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.tl2 button{padding:14px;border-radius:14px;background:var(--bg);font-weight:600;font-size:14px;text-align:left}
/* player */
#pl{position:absolute;inset:0;z-index:20;background:#0B0D12;color:#fff;display:flex;flex-direction:column}
.vwrap{position:relative;flex:none;height:56%;background:#000;overflow:hidden}
.vwrap:fullscreen{height:100%}
.ytw{position:absolute;inset:0;container-type:size;overflow:hidden;transition:filter 1s ease,transform 1s ease;background:#000}
.ytw iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:max(100cqw,177.78cqh);height:max(56.25cqw,100cqh);border:0;pointer-events:none}
.ytw.blur{filter:blur(28px) saturate(1.2);transform:scale(1.15)}
.cov{position:absolute;inset:0;z-index:2}
.vg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 28%,transparent 65%,rgba(0,0,0,.6));pointer-events:none}
.vt{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;z-index:7}
.vt .ib{background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(8px);box-shadow:none;width:36px;height:36px}
.vt .tk{height:36px;margin-left:auto}
.pc{position:absolute;left:12px;bottom:12px;z-index:3;padding:8px 13px;border-radius:14px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);font-size:12px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14)}
.pc b{font-size:17px;font-variant-numeric:tabular-nums}
.pc.fr{border-color:rgba(34,197,94,.6)}.pc.pm{border-color:rgba(167,139,250,.7)}
.pc i{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.25)}.pc.pm i{background:#A78BFA;box-shadow:0 0 0 4px rgba(167,139,250,.25)}
.off{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:4;background:#B45309;padding:6px 12px;border-radius:12px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap}
.off svg{width:14px;height:14px}
.hid{display:none!important}
.pp{position:absolute;right:12px;bottom:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
.pp svg{width:16px;height:16px}
.pw{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(10,12,25,.25);opacity:0;pointer-events:none;transition:opacity .8s}
.pw.on{opacity:1;pointer-events:auto}
.pwc{width:100%;max-width:300px;text-align:center;background:rgba(18,20,34,.72);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:16px 16px 12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pwc h3{font-size:17px;letter-spacing:-.3px}.pwc p{font-size:12.5px;color:#C4C8D6;margin:4px 0 10px;line-height:1.4}
.bal0{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.bal0 svg{width:20px;height:20px}
.pwc .big{margin-top:0;height:46px;font-size:15px}
.pwc .ghost{color:#aeb3c4;padding:8px;margin-top:2px;font-size:13px}
.er{position:absolute;inset:0;z-index:6;background:#12141f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;font-size:14px;color:#c9cddb}
.er button{padding:10px 18px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700}
.pi{flex:1;overflow-y:auto;padding:14px 16px 16px;scrollbar-width:none;background:linear-gradient(180deg,#12141f,#0B0D12)}

/* ---------- player + token engine ---------- */
function openStream(id){
  const s=STREAMS.find(x=>x.id===id);const granted=preview.claim(id);
  P={s,yt:null,playing:false,left:granted?FREE:0,paid:0,access:false,locked:false,err:false};
  R.route='player';
  const pl=document.createElement('div');pl.id='pl';
  pl.innerHTML=`<div class="vwrap" id="vw"><div class="ytw" id="ytw"><div id="vid"></div></div><div class="cov" data-a="pp"></div><div class="vg"></div>
  <div class="vt"><button class="ib" data-a="exit">${ic('back')}</button><span class="live">LIVE</span><span class="vw">${ic('eye')}${fmtV(s.v)}</span><button class="tk" data-a="pstore">${coin(20)}<span class="balv">${U().bal}</span></button><button class="ib" data-a="fs">${ic('max')}</button></div>
  <div class="off hid" id="off">${ic('wifi')}Connection lost · billing paused</div>
  <div class="pc hid" id="pc"></div><button class="pp" id="pp" data-a="pp">${ic('pause')}</button>
  <div class="pw" id="pw"><div class="pwc"><h3>Keep the stream going</h3><p>Add tokens to continue. You only pay for the minutes you watch.</p><div class="bal0">${coin(20)} Current balance: <b class="balv">0</b></div><button class="big" data-a="pstore">Buy Tokens to Continue</button><button class="ghost" data-a="exit">Maybe Later</button></div></div>
  <div class="er hid" id="er2"><div>This stream could not be loaded.<br>Check your connection and try again.</div><button data-a="retry">Retry</button></div></div>
  <div class="pi"><h2>${s.title}</h2><div class="ph2"><img src="${av(s.a)}" alt=""><div><b>${s.host}</b><small>${s.cat} · ${fmtV(s.v)} watching</small></div></div><div style="color:#c9cddb;font-size:13.5px;line-height:1.5">${s.desc}</div>
  <div class="rate"><div>Start<b>Instantly free</b></div><div>Keep watching<b>1 token / min</b></div></div><div class="sec" style="padding:8px 0;font-size:15px">Up next</div>${STREAMS.filter(x=>x.id!==id).slice(0,3).map(x=>`<div class="un" data-a="swap" data-v="${x.id}"><img src="${x.img}" alt="" onerror="this.remove()"><div><b>${x.title}</b><small>${x.host} · ${fmtV(x.v)}</small></div></div>`).join('')}</div>`;
  $('#body').appendChild(pl);$('#sbar').classList.add('dk');
  ytLoad(()=>{if(!P||P.s!==s)return;P.yt=new YT.Player('vid',{videoId:s.yt,host:'https://www.youtube-nocookie.com',playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,playsinline:1,iv_load_policy:3,origin:location.origin},events:{onReady:ytReadyEv,onStateChange:ytState,onError:()=>{if(P){P.err=true;P.playing=false;$('#er2').classList.remove('hid')}}}})});
  if(P.left===0)afterPreview(); else updChip();
  clearInterval(openStream.t);openStream.t=setInterval(tick,1000);
}
function exitStream(){clearInterval(openStream.t);try{P&&P.yt&&P.yt.destroy()}catch(e){}P=null;const pl=$('#pl');if(pl)pl.remove();closeOv();R.route=R.prevRoute||'home';render()}
function updChip(){
  const c=$('#pc');if(!c||!P)return;
  if(P.locked){c.classList.add('hid');return}
  c.classList.remove('hid','fr','pm');
  if(P.left>0){c.classList.add('fr');c.innerHTML=`<i></i><div>Free to watch<br><b>${fmtT(P.left)}</b> left</div>`}
  else if(P.access){c.classList.add('pm');c.innerHTML=`<i></i><div>Premium Viewing Active<br><small style="opacity:.8">Next token in ${fmtT(RATE-P.paid)}</small></div>`}
  else c.classList.add('hid');
}
function afterPreview(){if(U().bal>=1){P.access=true;P.paid=0;unlock()}else lock();updChip()}
function lock(){
  if(!P||P.locked)return;P.locked=true;P.access=false;
  $('#ytw').classList.add('blur');$('#pw').classList.add('on');$('#pp').classList.add('hid');updChip();
  let vol=100;const f=setInterval(()=>{vol-=15;try{if(!P||!P.yt||vol<=0||!P.locked){clearInterval(f);if(P&&P.yt&&P.locked)P.yt.mute();return}P.yt.setVolume(vol)}catch(e){clearInterval(f)}},80); // audio fades, then mutes
}
function unlock(){
  if(!P)return;P.locked=false;$('#ytw').classList.remove('blur');
  try{P.yt.unMute();P.yt.setVolume(100);if(!P.playing)P.yt.playVideo()}catch(e){}
  $('#pw').classList.remove('on');$('#pp').classList.remove('hid');updChip();
}
/* YouTube player events */
function ytLoad(cb){if(window.YT&&YT.Player)return cb();(window._ytq=window._ytq||[]).push(cb);if(!window._ytl){window._ytl=1;const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';t.onerror=()=>{if(P){P.err=true;$('#er2').classList.remove('hid')}};document.head.appendChild(t);window.onYouTubeIframeAPIReady=()=>window._ytq.splice(0).forEach(f=>f())}}
function ytReadyEv(e){if(!P)return;try{if(P.locked){e.target.mute()}else{e.target.unMute();e.target.setVolume(100)}e.target.playVideo()}catch(x){}
  const s=P.s;setTimeout(()=>{if(P&&P.s===s&&!P.playing&&!P.err){try{P.yt.mute();P.yt.playVideo();P.autoMuted=1;toast('Tap the video to start playback')}catch(x){}}},3500)}
function ytState(e){if(!P)return;const d=e.data;P.playing=d===1;if(d===1){P.err=false;$('#er2').classList.add('hid');$('#pp').innerHTML=ic('pause');if(P.autoMuted&&!P.locked){try{P.yt.unMute()}catch(x){}P.autoMuted=0}}
  if(d===2)$('#pp').innerHTML=ic('play');if(d===0)try{P.yt.playVideo()}catch(x){}}
function tick(){
  if(!P)return;
  const online=navigator.onLine&&!offSim;$('#off').classList.toggle('hid',online);
  if(!online||P.err||!P.playing)return; // no counting while offline, paused or buffering
  if(P.left>0){P.left--;if(P.left===0)afterPreview();else updChip();return}
  if(P.access&&!P.locked){
    P.paid++;
    if(P.paid>=RATE){P.paid=0;
      if(wallet.spend(1,`Watched: ${P.s.title}`)){syncBal(true)}
      if(U().bal<1){lock();toast('Tokens used up')}
    }
    updChip();
  }
}
/* called after any wallet change (purchase here or from another tab) */
function afterWalletChange(){if(P&&P.locked&&U().bal>=1&&P.left===0){P.access=true;P.paid=0;unlock()}else if(P&&!P.locked&&P.left===0&&P.access&&U().bal<1&&P.paid===0){}}
function syncBal(pop){
  document.querySelectorAll('.balv').forEach(e=>{const nv=String(U().bal);if(e.textContent!==nv){e.textContent=nv;if(pop){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}}});
}
/* other tab changed the account → sync */
addEventListener('storage',e=>{if(e.key!==KEY)return;DB=load();if(!DB.session&&R.route!=='login'){exitStreamSilent();go('login');return}if(!DB.session)return;syncBal(true);afterWalletChange();if(!P&&['wallet','profile'].includes(R.route))render()});
function exitStreamSilent(){clearInterval(openStream.t);try{P&&P.yt&&P.yt.destroy()}catch(e){}P=null;const pl=$('#pl');if(pl)pl.remove()}

/* ---------- go live (host) ---------- */
async function startCam(){try{if(!H_ms)H_ms=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});const c=$('#cam');if(!c)return;const v=document.createElement('video');v.muted=true;v.playsInline=true;v.autoplay=true;v.srcObject=H_ms;c.appendChild(v);const p=$('#cam0');if(p)p.remove()}catch(e){}}
const HN=['Riya','Kabir','Neha','Arjun','Sana','Vikram','Isha','Rohan','Priya','Dev'],HM=['Looking great!','Hello from Delhi','Audio is crystal clear','Love this stream','Can you say hi to me?','Sent you a gift','First time here, amazing','Please talk about pricing','Awesome content','Following you now'];
function goLive(){
  const lt=$('#lt');R.lt=(lt&&lt.value.trim())||'My first live stream';
  H={t:R.lt,c:R.lc||'Education',sec:0,v:1,e:0,pk:1};
  const hl=document.createElement('div');hl.id='hl';
  hl.innerHTML=`<div class="fb"><img src="${av(1)}" alt=""></div><div class="sc"></div><div class="ht"><span class="live">LIVE</span><span class="vw" id="hT">0:00</span><span class="vw">${ic('eye')}<b id="hV">1</b></span><span class="tk" style="margin-left:auto;height:34px">${coin(18)}<span id="hE">0</span></span></div><div class="hti">${H.t}</div><div class="hch" id="hc"></div><div class="hb"><button class="rb" data-a="hflip">${ic('video')}</button><button class="end" data-a="endlive">End Live</button></div>`;
  $('#body').appendChild(hl);
  if(H_ms){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.autoplay=true;v.srcObject=H_ms;hl.insertBefore(v,hl.querySelector('.sc'))}
  $('#sbar').classList.add('dk');toast('You are live',1);
  H.i=setInterval(hTick,1000);
}
function hTick(){
  if(!H)return;H.sec++;H.v=Math.max(1,H.v+Math.round(Math.random()*5-(H.sec<25?0:1.5))+(H.sec<6?2:0));H.pk=Math.max(H.pk,H.v);
  $('#hT').textContent=fmtT(H.sec);$('#hV').textContent=fmtV(H.v);
  if(H.sec%2===0){const c=$('#hc');const d=document.createElement('div');d.innerHTML=`<b>${HN[Math.floor(Math.random()*HN.length)]}</b> ${HM[Math.floor(Math.random()*HM.length)]}`;c.appendChild(d);while(c.children.length>6)c.firstChild.remove()}
  if(H.sec%6===0){H.e+=1+Math.floor(Math.random()*3);$('#hE').textContent=H.e;const f=document.createElement('div');f.className='fl';f.textContent='\u2764';$('#hl').appendChild(f);setTimeout(()=>f.remove(),2300)}
}
function endLive(){
  if(!H)return;clearInterval(H.i);const h=H;H=null;
  if(H_ms){H_ms.getTracks().forEach(t=>t.stop());H_ms=null}
  const hl=$('#hl');if(hl)hl.remove();$('#sbar').classList.remove('dk');
  if(h.e>0){DB=load();const u=U();u.bal+=h.e;u.tx.unshift({id:uid(),type:'c',amt:h.e,label:'Live earnings · '+h.t,t:Date.now(),st:'Earned'});save();syncBal(true)}
  sheet(`<div class="ph"><h1>Stream ended</h1><p>Nice work. Here is how your live went.</p></div><div class="st"><div>Duration<b>${fmtT(h.sec)}</b></div><div>Peak viewers<b>${fmtV(h.pk)}</b></div></div><div class="st" style="padding-top:0"><div>Tokens earned<b class="pos">${h.e}</b></div><div>Category<b style="font-size:16px">${h.c}</b></div></div><div style="padding:0 16px"><button class="big" data-a="hdone" style="margin-top:4px">Done</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case'lcat':{const lt=$('#lt');if(lt)R.lt=lt.value;R.lc=v;render();break}
    case'golive':goLive();break;
    case'endlive':endLive();break;
    case'hflip':toast('Camera switched');break;
    case'hdone':closeOv();go('home');break;
    case'go':go(v);break;
    case'search':go('explore');break;
    case'bell':sheet(`<div class="ph"><h1>Notifications</h1></div><div class="ni"><div>${coin(26)}</div><div><b>Welcome to Livora</b><small>Jump into any live stream, or go live yourself.</small></div></div><div class="ni"><div>${ic('eye',24)}</div><div><b>10 streams are live</b><small>Pick a category and start watching.</small></div></div><button class="ghost" data-a="close">Close</button>`);break;
    case'cat':R.cat=v;render();break;
    case'cat2':R.cat=v;go('home');break;
    case'open':R.prevRoute=R.route;openStream(v);break;
    case'swap':{const prev=R.prevRoute;exitStreamSilent();R.prevRoute=prev;openStream(v);break}
    case'exit':exitStream();break;
    case'store':go('store');break;
    case'pstore':openStoreSheet();break;
    case'buy':openBuy(+v);break;
    case'confirm':doPay();break;
    case'close':closeOv();break;
    case'fs':{const w=$('#vw');(document.fullscreenElement?document.exitFullscreen():w.requestFullscreen&&w.requestFullscreen()).catch&&0;break}
    case'pp':if(P&&!P.locked&&P.yt){P.playing?P.yt.pauseVideo():P.yt.playVideo()}break;
    case'retry':$('#er2').classList.add('hid');P.err=false;try{P.yt.loadVideoById(P.s.yt)}catch(x){}break;
    case'notif':R.notif=!R.notif;render();break;
    case'profile':go('profile');break;
    case'logout':DB.session=null;save();go('login');break;
    case'tools':openTools();break;
    case'quick':DB.session='9876543210';DB.users[DB.session]=DB.users[DB.session]||newUser('9876543210');save();closeOv();go('home');break;
    case'sendotp':{const p=$('#ph').value.replace(/\D/g,'');if(p.length!==10){$('#er').textContent='Enter a valid 10-digit mobile number.';return}R.phone=p;go('otp');break}
    case'verify':{if($('#otp').value!=='123456'){$('#er').textContent='Incorrect OTP. Use 123456 for the demo.';return}DB=load();DB.session=R.phone;DB.users[R.phone]=DB.users[R.phone]||newUser(R.phone);save();R.loading=true;go('home');setTimeout(()=>{R.loading=false;if(R.route==='home')render()},700);break}
    case't-add':wallet.credit(100,'100 Tokens · Demo top-up');closeOv();syncBal(true);toast('+100 tokens added',1);afterWalletChange();break;
    case't-zero':{DB=load();const u=U();u.bal=0;u.bought=0;u.used=0;u.tx=[];save();closeOv();syncBal(true);if(P&&P.left===0&&P.access)lock();toast('Wallet reset to 0');if(!P)render();break}
    case't-ff':if(P&&P.left>3){P.left=3;updChip()}closeOv();break;
    case't-bill':if(P&&P.access){P.paid=RATE-3;updChip()}closeOv();break;
    case't-off':offSim=!offSim;closeOv();toast(offSim?'Network disconnected':'Network restored');if(P)tick();break;
    case't-reset':{DB=load();const u=U();u.bal=0;u.bought=0;u.used=0;u.tx=[];u.prev={};save();closeOv();offSim=false;if(P)exitStreamSilent();R.cat='All';go('home');toast('Demo reset',1);break}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){R.q=e.target.value;const q=R.q.toLowerCase();const res=q?STREAMS.filter(s=>(s.title+s.host+s.cat).toLowerCase().includes(q)):[...STREAMS].sort((a,b)=>b.v-a.v).slice(0,6);$('#res').innerHTML=res.length?res.map(card).join(''):'<div class="empty">No streams found. Try another keyword.</div>'}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ph')document.querySelector('[data-a=sendotp]').click();if(e.key==='Enter'&&e.target.id==='otp')document.querySelector('[data-a=verify]').click();if((e.ctrlKey||e.metaKey)&&['u','s'].includes(e.key.toLowerCase())||e.key==='F12'||((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c'].includes(e.key.toLowerCase())))e.preventDefault()});
addEventListener('online',()=>toast('Back online'));addEventListener('offline',()=>toast('You are offline'));
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
render();
</script>
</body>
</html>
